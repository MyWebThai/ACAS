<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://slw-system.pages.dev/assets/css/font-face.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="container">
    <h2>เข้าสู่ระบบ</h2>
    <input type="text" id="id" placeholder="กรอกเลขประจำตัว">
    <div id="passwordDiv" style="display: none;">
      <input type="password" id="password" placeholder="รหัสผ่าน">
    </div>
    
    <center>
      <button id="checkBtn" onclick="checkId()">ตรวจสอบ</button>
      <button id="loginBtn" onclick="login()" style="display: none;">เข้าสู่ระบบ</button>
    </center>
  </div>

  <script src="script.js"></script>
</body>
</html>
