<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>กรอกข้อมูล</title>
</head>
<body>
  <h2>เพิ่มข้อมูล</h2>
  <p>เลขประจำตัว (ID): <span id="idDisplay"></span></p>
  <input type="text" id="name" placeholder="ชื่อ"><br><br>
  <input type="password" id="password" placeholder="ตั้งรหัสผ่าน"><br><br>
  <button onclick="submitForm()">บันทึก</button>

  <script>
    const id = localStorage.getItem("id");
    document.getElementById("idDisplay").innerText = id;

    function submitForm() {
      alert("ระบบบันทึกข้อมูล (เชื่อมต่อ API ได้ในภายหลัง)");
    }
  </script>
</body>
</html>
